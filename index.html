
<!DOCTYPE html>
<!-- Deus é fiel. -->

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zé Fominha</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <header class="header">

        <div class="header-container">

            <a href="./index.html" class="logo">

                <img
                    src="./assets/51 Sem Título_20260903102834.png"
                    alt="Logo Zé Fominha"
                    width="60"
                >

                <span class="logo-text">
                    <span class="logo-tittle">Zé Fominha</span>
                    <span class="Logo-subtitle">O melhor delivery</span>
                </span>

            </a>

            <nav class="main-nav">

                <a href="./index.html" class="nav-link active">Início</a>

                <a href="./cardapio.html" class="nav-link">Cardápio</a>

                <a href="./Sobre.html" class="nav-link">Sobre</a>

                <a href="./Carrinho.html" class="nav-link">Carrinho</a>

            </nav>

            <div class="header-actions">

                <div class="search-box">

                    <input
                        type="text"
                        placeholder="Buscar"
                        aria-label="Buscar"
                    >

                    <img
                        class="search-icon"
                        src="./Assets/icons8-pesquisar.svg"
                        alt=""
                        width="20"
                    >

                </div>

                <button type="button" class="btn-primary">
                    Cadastrar conta
                </button>

                <!-- Botão do menu responsivo -->
                <button
                    type="button"
                    class="hamburguer"
                    id="btn-menu"
                    aria-label="Abrir menu"
                    aria-expanded="false"
                    aria-controls="menu-principal"
                >
                    ☰ Menu
                </button>

                <!-- Botão de alternância do tema -->
                <button
                    type="button"
                    class="btn-tema"
                    id="btn-tema"
                    aria-label="Ativar modo escuro"
                >
                    🌙
                </button>

            </div>

        </div>

    </header>

    <script src="js/script.js"></script>

</body>
</html>
